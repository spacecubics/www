<div class="news-list-parent">
  <div class="news-list">
    <div class="news-list-content">
      <div class="news-list-grid" id="auto-news-list-container">
        <!-- Auto-generated news items will be inserted here by JavaScript -->
      </div>

      {% if news_note %}
        <p class="news-list__bottom-text">{{ news_note | safe }}</p>
      {% endif %}
    </div>
  </div>
</div>

<script>
// Auto-generate news list from dynamically generated data
document.addEventListener('DOMContentLoaded', function() {
  // Determine current language from URL or default to Japanese
  const pathname = window.location.pathname;
  const currentLang = pathname.includes('/en/') ? 'en' : 'ja';
  const dataFile = currentLang === 'en' ? '/js/news_data_en.json' : '/js/news_data_ja.json';
  const cacheBuster = '?v=' + Date.now();
  
  fetch(dataFile + cacheBuster)
    .then(response => response.json())
    .then(newsData => {
      const container = document.getElementById('auto-news-list-container');
      
      newsData.forEach(news => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="news-card-image">
            <img src="${news.img}" alt="${news.summary}" class="news-card-img">
          </div>
          <div class="news-card-content">
            <a href="${news.link}" class="news-card-link">
              <p class="news-card-date">${news.date}</p>
              <h3 class="news-card-title">${news.summary}</h3>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    })
    .catch(error => {
      console.error('Error loading news data:', error);
      // Fallback to default data if JSON loading fails
      const fallbackData = currentLang === 'en' ? [
        {
          date: "2025.06.01",
          link: "/en/news/2025-06-01/",
          img: "/news/jts.png",
          summary: "Space Cubics has changed from a limited liability company to a corporation."
        }
      ] : [
        {
          date: "2025.06.01",
          link: "/news/2025-06-01/",
          img: "/news/jts.png",
          summary: "Space Cubicsは合同会社から株式会社へ組織変更しました。"
        }
      ];
      
      const container = document.getElementById('auto-news-list-container');
      fallbackData.forEach(news => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="news-card-image">
            <img src="${news.img}" alt="${news.summary}" class="news-card-img">
          </div>
          <div class="news-card-content">
            <a href="${news.link}" class="news-card-link">
              <p class="news-card-date">${news.date}</p>
              <h3 class="news-card-title">${news.summary}</h3>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    });
});
</script>

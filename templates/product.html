{% extends "page.html" %}

{% block page_body %}

<div class="product">

  {% if page.toc and page.toc | length > 0 %}
  <nav class="quick-jump" aria-label="{{ language_strings.on_this_page }}">
    {% for h in page.toc %}
    <a class="quick-jump-item" href="#{{ h.id }}">
      <span class="title">{{ h.title }}</span>
      <span class="jump-button" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </a>
    {% endfor %}
  </nav>
  {% endif %}

  <div class="product-content">
    {{ page.content | safe }}
  </div>

</div>

{% endblock page_body %}

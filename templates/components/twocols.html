{% component twocols(title: string, line1: string, line2: string) -%}
{% set html -%}
<div class="twocols segment">
	<div class="twocols-left">
		{% include "partials/segment_title.html" %}
	</div>

	<div class="twocols-right">
		{{ body | safe }}
	</div>
</div>
{%- endset %}
{{- html | replace(from="\n", to=" ") | safe -}}
{%- endcomponent twocols %}

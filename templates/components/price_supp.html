{% component price_supp(title: string) -%}
{% set html -%}
<div class="price-supp">
	<div class="price-supp__container">
		<div class="price-supp__left">
			<div class="price-supp__title">{{ title }}</div>
		</div>
		<div class="price-supp__right">
			{{ body | markdown | safe }}
		</div>
	</div>
	<div class="sc-list__divider"></div>
</div>
{%- endset %}
{{- html | replace(from="\n", to=" ") | safe -}}
{%- endcomponent price_supp %}

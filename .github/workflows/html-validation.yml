name: HTML Validation

on:
  pull_request:
    paths-ignore:
      - AGENTS.md
      - doc/**
      - README.md

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VNU_URL: https://github.com/validator/validator/releases/download/latest/vnu.jar
      ZOLA_VERSION: "0.22.0"
      ZOLA_BIN: ${{ github.workspace }}/zola
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nu HTML Checker
        run: curl --fail --location --silent --show-error "$VNU_URL" --output vnu.jar

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz
          "$ZOLA_BIN" --version

      - name: Build site
        run: "$ZOLA_BIN" build

      - name: Validate HTML
        run: |
          # Zola's built-in alias template omits the html language attribute.
          mapfile -d '' html_files < <(
            find public -name '*.html' \
              ! -path '*/news/page/1/index.html' \
              -print0
          )
          java -jar vnu.jar --errors-only --format gnu "${html_files[@]}"
